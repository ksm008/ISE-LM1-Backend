# /etc/rsyslog.d/60-iselm1.conf
# RHEL·UNIX 계열의 로그 파일 이름으로도 남긴다 (정보보안기사·리눅스마스터 실습용).
# Ubuntu 기본 파일(/var/log/auth.log, /var/log/syslog)은 그대로 남는다.

# 인증·권한 관련 로그 (RHEL 의 /var/log/secure, Ubuntu 의 /var/log/auth.log 와 같은 내용)
authpriv.*                          /var/log/secure

# su 사용 기록 (util-linux su 는 login.defs 의 SULOG_FILE 을 지원하지 않으므로 syslog 로 모은다)
:programname, isequal, "su"         /var/log/sulog
