# /etc/systemd/system/docker.service.d/override.conf
# Docker API 를 TLS 인증(2376)으로만 연다. 인증 없는 2375 는 열지 않는다.
# 기존에 2375 를 연 설정(이 파일의 다른 ExecStart, /etc/docker/daemon.json 의 "hosts")이 있으면 지운다.
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2376 --tlsverify --tlscacert=/etc/docker/tls/ca.pem --tlscert=/etc/docker/tls/server-cert.pem --tlskey=/etc/docker/tls/server-key.pem --containerd=/run/containerd/containerd.sock
