spring.application.name=ise-lm1-backend

# 실제 실습 서버 주소 등은 git 에 올리지 않는 파일에 둔다 (application-local.properties.example 참고)
spring.config.import=optional:file:./application-local.properties

# ---- 실습 서버 연결 (환경 변수로도 지정 가능: LAB_DOCKER_HOST, LAB_EBPF_AGENTURL 등) ----
# Docker Engine API. 원격 호스트는 TLS(2376) 사용을 권장한다.
lab.docker.host=tcp://localhost:2375
lab.docker.tls-verify=false
# tls-verify=true 일 때 ca.pem, cert.pem, key.pem 이 있는 디렉터리
lab.docker.cert-path=

# eBPF 로그 에이전트 (뒤에 /stream?containerId= 가 붙는다)
lab.ebpf.agent-url=http://localhost:9000

# ---- 프론트엔드 Origin (쉼표로 여러 개 지정) ----
lab.cors.allowed-origins=http://localhost:5173

# ---- 실습 컨테이너 ----
lab.container.image=sec-lab-ubuntu:1.0
lab.container.memory-mb=512
lab.container.cpus=1.0
lab.container.pids-limit=256

# ---- 실습 세션 ----
# 동시에 실행할 수 있는 실습 컨테이너 수
lab.session.max-sessions=10
# 입력이 없을 때 터미널 연결을 끊는 시간 (끊기면 컨테이너 삭제)
lab.session.idle-timeout=30m
# SSE 연결 유지 시간 (만료되면 브라우저가 자동 재연결)
lab.session.sse-timeout=30m
