spring.application.name=ise-lm1-backend

# 실제 실습 서버 주소 등은 git 에 올리지 않는 파일에 둔다 (application-local.properties.example 참고)
spring.config.import=optional:file:./application-local.properties

# ---- 실습 서버 연결 (환경 변수로도 지정 가능: LAB_DOCKER_HOST, LAB_EBPF_AGENTURL 등) ----
# Docker Engine API. 원격 호스트는 TLS(2376) 사용을 권장한다.
lab.docker.host=tcp://localhost:2375
lab.docker.tls-verify=false
# tls-verify=true 일 때 ca.pem, cert.pem, key.pem 이 있는 디렉터리
lab.docker.cert-path=

# eBPF 로그 에이전트 (뒤에 /stream?containerId= 가 붙는다)
lab.ebpf.agent-url=http://localhost:9000

# ---- 프론트엔드 Origin (쉼표로 여러 개 지정) ----
lab.cors.allowed-origins=http://localhost:5173

# ---- 실습 컨테이너 ----
# 이미지 정의: deploy/lab-image/Dockerfile (이전 태그는 되돌릴 때를 위해 실습 서버에 남겨 둠)
lab.container.image=sec-lab-ubuntu:1.2
lab.container.memory-mb=512
lab.container.cpus=1.0
lab.container.pids-limit=256
# 실습 컨테이너에서 apt 로 패키지 설치 차단 (sudo 를 써도 설치 불가, dpkg 는 조회만 허용)
lab.container.block-package-install=true
# 컨테이너에 추가할 Linux capability (쉼표로 여러 개). SYS_PACCT = 프로세스 accounting (lastcomm)
lab.container.cap-add=SYS_PACCT

# ---- 실습 세션 ----
# 동시에 실행할 수 있는 실습 컨테이너 수
lab.session.max-sessions=10
# 실습 세션 유지 시간. 프론트의 "세션 갱신" 버튼을 누르면 그 시점부터 다시 이 시간만큼 연장 (만료되면 컨테이너 삭제)
lab.session.lease=10m
# SSE 연결 유지 시간 (만료되면 브라우저가 자동 재연결)
lab.session.sse-timeout=30m

# ---- 회원 DB (PostgreSQL). 실제 주소·비밀번호는 application-local.properties ----
spring.datasource.url=jdbc:postgresql://localhost:5432/iselm1
spring.datasource.username=iselm1
spring.datasource.password=
# 테이블은 Flyway(src/main/resources/db/migration)로만 바꾸고, Hibernate 는 맞는지만 확인한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- 로그인 세션 ----
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 리버스 프록시(Nginx) 뒤에서 X-Forwarded-* 로 원래 주소를 알아낸다 (구글 리디렉션 URI)
server.forward-headers-strategy=native

# ---- 회원 기능 ----
# 구글 로그인 후 돌아갈 프론트엔드 주소
auth.frontend-url=http://localhost:5173
# 이메일 인증번호 유효 시간, 다시 보내기 대기 시간, 입력 가능 횟수
auth.verification.code-ttl=10m
auth.verification.resend-cooldown=60s
auth.verification.max-attempts=5
# 같은 아이디로 연속 실패 시 로그인 잠금
auth.login.max-failures=5
auth.login.lock-duration=5m

# ---- 인증번호 메일 (SMTP). 계정은 application-local.properties 의 spring.mail.* ----
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
