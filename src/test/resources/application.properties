# 자동 테스트 전용 설정 (main 의 application.properties 대신 쓰인다)
# 실제 DB(PostgreSQL)·실습 서버에 붙지 않도록 메모리 DB 와 닿지 않는 주소를 쓴다.
spring.application.name=ise-lm1-backend-test
spring.datasource.url=jdbc:h2:mem:iselm1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

lab.docker.host=tcp://127.0.0.1:1
lab.ebpf.agent-url=http://127.0.0.1:1
lab.cors.allowed-origins=http://localhost:5173

auth.frontend-url=http://localhost:5173

# 관리자 계정 자동 생성 확인용
auth.admin.username=admin_test
auth.admin.password=Admin!2345
auth.admin.email=admin@example.com
